name: Refresh profile contributions

on:
  schedule:
    - cron: '47 0 * * *' # Daily at 00:47 UTC / 06:17 IST (GitHub may delay runs).
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/update_contributions.py'
      - 'scripts/update_insights.py'
      - 'scripts/requirements-contributions.txt'
      - 'profile/config.json'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-contributions.txt
      - name: Install calendar parser
        run: python -m pip install -r scripts/requirements-contributions.txt
      - name: Fetch and render actual GitHub contributions
        run: python scripts/update_contributions.py
      - name: Refresh stats, language donut and activity chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_insights.py
      - name: Commit changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md public/profile/contributions.json public/profile/contributions.svg public/profile/insights.json public/profile/insights.svg public/profile/insights-mobile.svg public/profile/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution graph'
            git push
          fi
